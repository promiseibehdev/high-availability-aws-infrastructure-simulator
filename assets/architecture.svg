<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">High-Availability AWS Infrastructure Simulator architecture</title>
  <description id="description">An internet-facing load balancer routes traffic to private application instances across two Availability Zones, supported by Auto Scaling, IAM, S3, and simulated monitoring.</description>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <text x="60" y="56" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">High-Availability AWS Infrastructure</text>
  <text x="60" y="84" font-family="Arial, sans-serif" font-size="15" fill="#475569">Production-shaped, fully offline simulation</text>

  <rect x="42" y="108" width="1116" height="458" rx="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="68" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">VPC · 10.20.0.0/16</text>

  <rect x="78" y="170" width="1044" height="90" rx="18" fill="#ffffff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <text x="600" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">PUBLIC ENTRY TIER</text>
  <rect x="448" y="209" width="304" height="36" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="600" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Application Load Balancer</text>

  <rect x="78" y="286" width="492" height="184" rx="18" fill="#ffffff" stroke="#bbf7d0" filter="url(#shadow)"/>
  <rect x="630" y="286" width="492" height="184" rx="18" fill="#ffffff" stroke="#bbf7d0" filter="url(#shadow)"/>
  <text x="102" y="318" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">Availability Zone A</text>
  <text x="654" y="318" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">Availability Zone B</text>
  <text x="102" y="344" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Private subnet · 10.20.10.0/24</text>
  <text x="654" y="344" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Private subnet · 10.20.11.0/24</text>
  <rect x="176" y="370" width="296" height="55" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="728" y="370" width="296" height="55" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="324" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14532d">Private EC2 Instance A</text>
  <text x="324" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">No public IP · no public SSH</text>
  <text x="876" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14532d">Private EC2 Instance B</text>
  <text x="876" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">No public IP · no public SSH</text>

  <rect x="126" y="498" width="260" height="42" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <rect x="470" y="498" width="260" height="42" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <rect x="814" y="498" width="260" height="42" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="256" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#78350f">CloudWatch-style Monitoring</text>
  <text x="600" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4c1d95">Auto Scaling Group</text>
  <text x="944" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#78350f">IAM Role → Private S3</text>

  <line x1="600" y1="130" x2="600" y2="205" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="614" y="163" font-family="Arial, sans-serif" font-size="12" fill="#475569">Internet Gateway</text>
  <line x1="540" y1="245" x2="350" y2="366" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="245" x2="850" y2="366" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="425" x2="550" y2="494" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="425" x2="650" y2="494" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Every resource, metric, alarm, and failure shown by the application is simulated.</text>
</svg>
